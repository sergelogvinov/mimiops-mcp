  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events/status
  verbs:
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
