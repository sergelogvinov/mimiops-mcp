# Kubernetes RBAC Configuration for mimiops-mcp
# This file defines the permissions required for the mimiops-mcp server

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mimiops-mcp-reader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mimiops-mcp-reader
rules:
# Pods — Stage 1 (unchanged) — also used by nodes tools for allocated-resource sums
- apiGroups: [""]
  resources: [pods, pods/log, pods/status]
  verbs: [get, list, watch]
# Jobs + CronJobs — Stage 2 (unchanged)
- apiGroups: ["batch"]
  resources: [jobs, jobs/status, cronjobs, cronjobs/status]
  verbs: [get, list, watch]
# Nodes + Namespaces — Stage 3 (NEW)
- apiGroups: [""]
  resources: [nodes, nodes/status, namespaces, namespaces/status]
  verbs: [get, list, watch]
# ResourceQuotas + LimitRanges — Stage 3 (NEW, namespaced)
- apiGroups: [""]
  resources: [resourcequotas, resourcequotas/status, limitranges]
  verbs: [get, list, watch]
# StorageClasses — Stage 3 (NEW, storage.k8s.io/v1)
- apiGroups: ["storage.k8s.io"]
  resources: [storageclasses]
  verbs: [get, list, watch]
# PriorityClasses — Stage 3 (NEW, scheduling.k8s.io/v1)
- apiGroups: ["scheduling.k8s.io"]
  resources: [priorityclasses]
  verbs: [get, list, watch]
# Events — Stage 3 (NEW, core/v1)
- apiGroups: [""]
  resources: [events]
  verbs: [get, list, watch]
# Flux sources — FluxCD extension
- apiGroups: ["source.toolkit.fluxcd.io"]
  resources: [gitrepositories, gitrepositories/status, ocirepositories, ocirepositories/status]
  verbs: [get, list, watch]
# Flux Helm — FluxCD extension
- apiGroups: ["helm.toolkit.fluxcd.io"]
  resources: [helmreleases, helmreleases/status]
  verbs: [get, list, watch]
# Flux Kustomize — FluxCD extension
- apiGroups: ["kustomize.toolkit.fluxcd.io"]
  resources: [kustomizations, kustomizations/status]
  verbs: [get, list, watch]
---
# Destructive permissions (separate ClusterRole, not bound by default)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mimiops-mcp-destructive
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [delete]
- apiGroups: ["apps"]
  resources: [deployments, statefulsets, daemonsets]
  verbs: [patch]
- apiGroups: ["apps"]
  resources: [deployments/scale, statefulsets/scale]
  verbs: [get, update, patch]
# Flux reconcile (writes reconcile.fluxcd.io/requestedAt annotation) — FluxCD extension
- apiGroups: ["source.toolkit.fluxcd.io"]
  resources: [gitrepositories, ocirepositories]
  verbs: [get, list, watch, patch, update]
# Flux reconcile + suspend/resume (writes spec.suspend) — FluxCD extension
- apiGroups: ["helm.toolkit.fluxcd.io"]
  resources: [helmreleases]
  verbs: [get, list, watch, patch, update]
- apiGroups: ["kustomize.toolkit.fluxcd.io"]
  resources: [kustomizations]
  verbs: [get, list, watch, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mimiops-mcp-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mimiops-mcp-reader
subjects:
- kind: ServiceAccount
  name: mimiops-mcp-reader
  namespace: default
